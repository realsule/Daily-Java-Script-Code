<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking System</title>
    <link rel="stylesheet" href="img.css">
</head>
<body>
    <header>
        <h1>Service Booking System</h1>
    </header>
    <main>
        <section id="services">
            <h2>Available Services</h2>


            <div class="service-card">

                <h3>Service 1</h3>

                <img  class="" src="" alt="Screen Print Image">
                <p>Description: Lorem ipsum dolor sit amet.</p>
                <p>Fee: $50</p>
                <button onclick="bookService('service1')">Book Now</button>
            </div>
            <div class="service-card">
                <h3>Service 2</h3>
                <img src="" alt="Digital Print mACHINE">
                <p>Description: Lorem ipsum dolor sit amet.</p>
                <p>Fee: $100</p>
                <button onclick="bookService('service2')">Book Now</button>
            </div>
        </section>
        <section id="booking-form">
            <h2>Booking Form</h2>
            <form id="bookingForm">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>
                <label for="service">Service:</label>
                <input type="text" id="service" name="service" required>
                <br><br>
                <label for="platform">Platform:</label>
                <select id="platform" name="platform">
                    <option value="whatsapp">WhatsApp</option>
                    <option value="instagram">Instagram</option>
                    <option value="linkedin">LinkedIn</option>
                </select>
                <br><br>
                <button type="submit">Submit</button>
            </form>
        </section>
        <section id="payment">
            <h2>Payment</h2>
            <form id="paymentForm">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" required>
                <br><br>
                <label for="paymentMethod">Payment Method:</label>
                <select id="paymentMethod" name="paymentMethod">
                    <option value="crypto">Crypto</option>
                    <option value="mpesa">M-Pesa</option>
                </select>
                <br><br>
                <button type="submit">Pay Now</button>
            </form>
        </section>

        <section>

        </section>
    </main>
    <footer>
        <p>&copy; 2023 Service Booking System</p>
    </footer>
    <script src="img.js"></script>
</body>
</html>
